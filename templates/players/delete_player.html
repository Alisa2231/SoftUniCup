{% extends 'common/base.html' %}

{% block content %}
<section class="delete-team-page">
    <div class="delete-team-card">

        <div class="delete-icon-wrapper">
            <i class="bi bi-shield-exclamation"></i>
        </div>

        <p class="delete-eyebrow">TEAM MANAGEMENT</p>

        <h1>Delete Player</h1>

        <p class="delete-intro">
            Are you sure you want to delete this player?
        </p>

        <div class="team-preview">
            <div class="team-preview-logo">
                <i class="bi bi-shield-fill"></i>
            </div>

            <div class="team-preview-info">
                <h2>{{ player.first_name }} {{ player.last_name }}</h2>
                <p>{{ team.name }} {{ team.city }}</p>
            </div>
        </div>

        <div class="delete-warning">
            <i class="bi bi-exclamation-triangle-fill"></i>
            <p>
                <strong>This action cannot be undone.</strong>
            </p>
        </div>

        <form method="post" class="delete-team-form">
            {% csrf_token %}

            <a href="{% url 'players:details' team_slug=team.slug pk=player.pk %}"
               class="btn-cancel">
                <i class="bi bi-arrow-left"></i>
                Cancel
            </a>

            <button type="submit" class="btn-delete">
                <i class="bi bi-trash3"></i>
                Delete Player
            </button>
        </form>

    </div>
</section>
{% endblock %}
