<div class="game-form-grid">

    <!-- Location -->
    <div class="game-form-field">
        <label for="{{ form.location.id_for_label }}"
               class="form-label">
            {{ form.location.label }}
            <span class="game-required">*</span>
        </label>

        {{ form.location }}

        {% for error in form.location.errors %}
            <div class="game-field-error">
                <i class="bi bi-exclamation-circle"></i>
                {{ error }}
            </div>
        {% endfor %}
    </div>

    <!-- Date and Time -->
    <div class="game-form-field">
        <label for="{{ form.date_and_time.id_for_label }}"
               class="form-label">
            {{ form.date_and_time.label }}
            <span class="game-required">*</span>
        </label>

        {{ form.date_and_time }}

        {% for error in form.date_and_time.errors %}
            <div class="game-field-error">
                <i class="bi bi-exclamation-circle"></i>
                {{ error }}
            </div>
        {% endfor %}
    </div>

    <!-- Referee -->
    <div class="game-form-field game-form-field-full">
        <label for="{{ form.referee.id_for_label }}"
               class="form-label">
            {{ form.referee.label }}
            <span class="game-required">*</span>
        </label>

        {{ form.referee }}

        {% for error in form.referee.errors %}
            <div class="game-field-error">
                <i class="bi bi-exclamation-circle"></i>
                {{ error }}
            </div>
        {% endfor %}
    </div>

</div>
